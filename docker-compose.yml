# Local WordPress for QLU Monthly Magazine theme/CPT work.
# Production: managed WordPress host (see docs/TECHNICAL.md).

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qlu_magazine}
      MYSQL_USER: ${MYSQL_USER:-qlu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qlu_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qlu_root_dev_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.7-php8.2-apache
    restart: unless-stopped
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-qlu}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-qlu_dev_password}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-qlu_magazine}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/qlu-magazine:/var/www/html/wp-content/themes/qlu-magazine
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  wp_data:
